# pytest configuration file for scraping pipeline tests

[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output and reporting
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src/pipelines
    --cov=src/scrapers
    --cov=src/storage
    --cov-report=html:tests/coverage_html
    --cov-report=xml:tests/coverage.xml
    --cov-report=term-missing
    --html=tests/test_report.html
    --self-contained-html
    --json-report
    --json-report-file=tests/test_report.json

# Markers for different test categories
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (requires external resources)
    performance: Performance tests (may take longer)
    slow: Slow running tests
    database: Tests requiring database connection
    network: Tests requiring network access
    scraping: Tests related to web scraping
    storage: Tests related to data storage
    error_handling: Tests for error scenarios
    data_validation: Tests for data quality and validation

# Minimum version
minversion = 7.0

# Test timeout (in seconds)
timeout = 300

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:distutils

# Console output style
console_output_style = progress
